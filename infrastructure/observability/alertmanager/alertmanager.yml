route:
  group_by: ["severity", "service", "alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "telegram-admin"

  routes:
    - receiver: "telegram-admin"
      matchers:
        - severity =~ "critical|warning"

receivers:
  - name: "telegram-admin"
    telegram_configs:
      - bot_token: "${TELEGRAM_ALERT_BOT_TOKEN}"
        chat_id: ${TELEGRAM_ALERT_CHAT_ID}
        parse_mode: "HTML"
        message: |
          <b>{{ .Status | toUpper }}</b>
          <b>Alert:</b> {{ .GroupLabels.alertname }}
          <b>Service:</b> {{ .GroupLabels.service }}
          <b>Severity:</b> {{ .GroupLabels.severity }}
          {{ range .Alerts }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["service"]
