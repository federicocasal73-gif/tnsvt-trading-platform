version: "3.9"

# ═══════════════════════════════════════════════════════════════
# TNSVT V2 - Docker Compose para desarrollo
# Fase 1 (MVP) - 17 servicios
# ═══════════════════════════════════════════════════════════════

x-restart-policy: &restart_policy
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ───────────────────────────────────────────────────────────────
# RED
# ───────────────────────────────────────────────────────────────
networks:
  tnsvt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ───────────────────────────────────────────────────────────────
# VOLUMENES
# ───────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  nats-data:
  ollama-data:
  prometheus-data:
  grafana-data:
  traefik-letsencrypt:
  tnsvt-secrets:

# ═══════════════════════════════════════════════════════════════
# SERVICIOS DE INFRAESTRUCTURA
# ═══════════════════════════════════════════════════════════════

# ─── PostgreSQL 16 + TimescaleDB ────────────────────────────────
services:
  postgres:
    <<: *restart_policy
    <<: *logging
    image: timescale/timescaledb:latest-pg16
    container_name: tnsvt-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: 2
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tnsvt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tnsvt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7+ ───────────────────────────────────────────────
  redis:
    <<: *restart_policy
    <<: *logging
    image: redis:7-alpine
    container_name: tnsvt-redis
    hostname: redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - tnsvt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── NATS + JetStream ───────────────────────────────────────
  nats:
    <<: *restart_policy
    <<: *logging
    image: nats:2.10-alpine
    container_name: tnsvt-nats
    hostname: nats
    command: >
      --name=tnsvt-nats
      --http_port=8222
      --cluster_name=${NATS_CLUSTER_NAME:-tnsvt-cluster}
      --jetstream
      --store_dir=/data/jetstream
      --max_payload=${NATS_MAX_PAYLOAD:-10MB}
      --log_level=info
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    networks:
      - tnsvt-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama (LLM self-hosted) ───────────────────────────────
  ollama:
    <<: *restart_policy
    <<: *logging
    image: ollama/ollama:latest
    container_name: tnsvt-ollama
    hostname: ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: "*"
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - tnsvt-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── Traefik (API Gateway + Reverse Proxy) ──────────────────
  traefik:
    <<: *restart_policy
    <<: *logging
    image: traefik:v3.0
    container_name: tnsvt-traefik
    hostname: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=tnsvt-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.traefik.address=:8080"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      - "--accesslog=true"
      - "--accesslog.fields.headers.names=X-Forwarded-For,X-Real-IP,User-Agent"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - tnsvt-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

# ═══════════════════════════════════════════════════════════════
# OBSERVABILIDAD
# ═══════════════════════════════════════════════════════════════

  # ─── Prometheus ─────────────────────────────────────────────
  prometheus:
    <<: *restart_policy
    <<: *logging
    image: prom/prometheus:latest
    container_name: tnsvt-prometheus
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - tnsvt-network
    depends_on:
      - traefik

  # ─── Exporters (Prometheus metrics sources) ─────────────────
  postgres-exporter:
    <<: *restart_policy
    <<: *logging
    image: prometheuscommunity/postgres-exporter:latest
    container_name: tnsvt-postgres-exporter
    hostname: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-tnsvt}:${POSTGRES_PASSWORD:-tnsvt}@postgres:5432/${POSTGRES_DB:-tnsvt}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    networks:
      - tnsvt-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    <<: *restart_policy
    <<: *logging
    image: oliver006/redis_exporter:latest
    container_name: tnsvt-redis-exporter
    hostname: redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    networks:
      - tnsvt-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    <<: *restart_policy
    <<: *logging
    image: prom/node-exporter:latest
    container_name: tnsvt-node-exporter
    hostname: node-exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - tnsvt-network
    restart: unless-stopped

  # ─── Alertmanager ───────────────────────────────────────────
  alertmanager:
    <<: *restart_policy
    image: prom/alertmanager:latest
    container_name: tnsvt-alertmanager
    hostname: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=info"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infrastructure/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - tnsvt-network
    depends_on:
      - prometheus

  # ─── Loki ───────────────────────────────────────────────────
  loki:
    <<: *restart_policy
    image: grafana/loki:3.0
    container_name: tnsvt-loki
    hostname: loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
      - "-log.level=info"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - tnsvt-network

  # ─── Grafana ────────────────────────────────────────────────
  grafana:
    <<: *restart_policy
    <<: *logging
    image: grafana/grafana:latest
    container_name: tnsvt-grafana
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - tnsvt-network
    depends_on:
      - prometheus
      - loki
      - alertmanager

# ═══════════════════════════════════════════════════════════════
# PLACEHOLDERS - Servicios de aplicación (Fase 1)
# Se implementarán en próximos pasos
# ═══════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════
  # SERVICIOS DE APLICACIÓN (Fase 1)
  # ═══════════════════════════════════════════════════════════════

  auth-service:
    build:
      context: .
      dockerfile: apps/platform/auth-service/Dockerfile
    container_name: tnsvt-auth-service
    hostname: auth-service
    environment:
      AUTH_SERVICE_PORT: "8001"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_min_32_chars_abc}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-service.rule=Host(`api.localhost`) && PathPrefix(`/api/v1/auth`)"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8001"

  # api-gateway:
  api-gateway:
    build:
      context: .
      dockerfile: apps/gateway/api-gateway/Dockerfile
    container_name: tnsvt-api-gateway
    hostname: api-gateway
    environment:
      API_GATEWAY_PORT: "8000"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_HOST: nats
      NATS_PORT: "4222"
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_min_32_chars_abc}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`api.localhost`) || Host(`localhost`)"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8000"

  signal-engine:
    build:
      context: .
      dockerfile: apps/trading/signal-engine/Dockerfile
    container_name: tnsvt-signal-engine
    hostname: signal-engine
    environment:
      SIGNAL_ENGINE_PORT: "8003"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_HOST: nats
      NATS_PORT: "4222"
      SIGNAL_DEDUP_TTL_MINUTES: "10"
      SIGNAL_INGEST_API_KEY: ${SIGNAL_INGEST_API_KEY:-dev_ingest_key_change_me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  telegram-bridge:
    build:
      context: .
      dockerfile: apps/trading/signal-engine/telegram-bridge/Dockerfile
    container_name: tnsvt-telegram-bridge
    hostname: telegram-bridge
    environment:
      TELETHON_API_ID: ${TELETHON_API_ID:-}
      TELETHON_API_HASH: ${TELETHON_API_HASH:-}
      TELETHON_PHONE: ${TELETHON_PHONE:-}
      CHANNELS: ${CHANNELS:-}
      SIGNAL_ENGINE_URL: http://signal-engine:8003
      SIGNAL_INGEST_API_KEY: ${SIGNAL_INGEST_API_KEY:-dev_ingest_key_change_me}
    depends_on:
      - signal-engine
    networks:
      - tnsvt-network
    restart: unless-stopped

  risk-engine:
    build:
      context: .
      dockerfile: apps/risk/risk-engine/Dockerfile
    container_name: tnsvt-risk-engine
    hostname: risk-engine
    environment:
      RISK_ENGINE_PORT: "8006"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_HOST: nats
      NATS_PORT: "4222"
      RISK_DAILY_LOSS_LIMIT: "500"
      RISK_DAILY_PROFIT_TARGET: "1000"
      RISK_WEEKLY_LOSS_LIMIT: "1500"
      RISK_MAX_OPEN_POSITIONS: "5"
      RISK_TRAILING_STOP: "true"
      RISK_TRAILING_STEP: "10"
      RISK_TRAILING_START: "20"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  execution-engine:
    build:
      context: .
      dockerfile: apps/trading/execution-engine/Dockerfile
    container_name: tnsvt-execution-engine
    hostname: execution-engine
    environment:
      EXECUTION_ENGINE_PORT: "8004"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_HOST: nats
      NATS_PORT: "4222"
      DEFAULT_BROKER: "mt5"
      DEFAULT_ACCOUNT_ID: ${FTMO_ACCOUNT_ID:-default}
      LST_ACCOUNT_ID: ${LST_ACCOUNT_ID:-}
      LST_ACCOUNT_ID_FILE: /var/run/tnsvt/secrets/lst_account_id
      EXECUTION_TIMEOUT_SECONDS: "30"
      EXECUTION_RETRY_MAX: "3"
      EXECUTION_RETRY_BACKOFF: "2"
      MT5_CONNECTOR_URL: http://mt5-connector:8007
      RISK_ENGINE_URL: http://risk-engine:8006
    volumes:
      - tnsvt-secrets:/var/run/tnsvt/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      lst-account-bootstrap:
        condition: service_completed_successfully
    networks:
      - tnsvt-network
    restart: unless-stopped

  copy-trading:
    build:
      context: .
      dockerfile: apps/trading/copy-trading/Dockerfile
    container_name: tnsvt-copy-trading
    hostname: copy-trading
    environment:
      COPY_TRADING_PORT: "8005"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_HOST: nats
      NATS_PORT: "4222"
      EXECUTION_ENGINE_URL: http://execution-engine:8004
      COPY_TRADING_MAX_ACCOUNTS: "20"
      COPY_TRADING_TIMEOUT_SECONDS: "60"
    ports:
      - "${COPY_TRADING_PORT:-8005}:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  audit-engine:
    build:
      context: .
      dockerfile: apps/audit/audit-engine/Dockerfile
    container_name: tnsvt-audit-engine
    hostname: audit-engine
    environment:
      AUDIT_ENGINE_PORT: "8600"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      NATS_HOST: nats
      NATS_PORT: "4222"
    ports:
      - "${AUDIT_ENGINE_PORT:-8600}:8600"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  telegram-bot-service:
    build:
      context: .
      dockerfile: apps/notification/telegram-bot-service/Dockerfile
    container_name: tnsvt-telegram-bot
    hostname: telegram-bot-service
    environment:
      TELEGRAM_BOT_PORT: "8503"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_HOST: nats
      NATS_PORT: "4222"
    ports:
      - "${TELEGRAM_BOT_PORT:-8503}:8503"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: apps/platform/user-service/Dockerfile
    container_name: tnsvt-user-service
    hostname: user-service
    environment:
      USER_SERVICE_PORT: "8401"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_HOST: nats
      NATS_PORT: "4222"
    ports:
      - "${USER_SERVICE_PORT:-8401}:8401"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  ai-core:
    build:
      context: .
      dockerfile: apps/ai/ai-core/Dockerfile
    container_name: tnsvt-ai-core
    hostname: ai-core
    environment:
      AI_CORE_ENV: ${AI_CORE_ENV:-development}
      AI_CORE_LOG_LEVEL: ${AI_CORE_LOG_LEVEL:-INFO}
      AI_CORE_POSTGRES_HOST: postgres
      AI_CORE_POSTGRES_PORT: "5432"
      AI_CORE_POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      AI_CORE_POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      AI_CORE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      AI_CORE_REDIS_HOST: redis
      AI_CORE_REDIS_PORT: "6379"
      AI_CORE_NATS_URL: nats://nats:4222
      AI_CORE_OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      AI_CORE_OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      AI_CORE_OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      AI_CORE_SCORE_EXECUTE_THRESHOLD: "70.0"
      AI_CORE_SCORE_MONITOR_THRESHOLD: "50.0"
      AI_CORE_SCORE_MIN_CONFIDENCE: "0.40"
    ports:
      - "${AI_CORE_PORT:-8200}:8200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - tnsvt-network
    restart: unless-stopped

  regime-detector:
    build:
      context: .
      dockerfile: apps/ai/regime-detector/Dockerfile
    container_name: tnsvt-regime-detector
    hostname: regime-detector
    environment:
      REGIME_DETECTOR_ENV: ${REGIME_DETECTOR_ENV:-development}
      REGIME_DETECTOR_LOG_LEVEL: ${REGIME_DETECTOR_LOG_LEVEL:-INFO}
      REGIME_DETECTOR_POSTGRES_HOST: postgres
      REGIME_DETECTOR_POSTGRES_PORT: "5432"
      REGIME_DETECTOR_POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      REGIME_DETECTOR_POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      REGIME_DETECTOR_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      REGIME_DETECTOR_REDIS_HOST: redis
      REGIME_DETECTOR_REDIS_PORT: "6379"
      REGIME_DETECTOR_NATS_URL: nats://nats:4222
      REGIME_DETECTOR_CLASSIFY_INTERVAL_SEC: "5"
    ports:
      - "${REGIME_DETECTOR_PORT:-8201}:8201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  liquidity-engine:
    build:
      context: .
      dockerfile: apps/ai/liquidity-engine/Dockerfile
    container_name: tnsvt-liquidity-engine
    hostname: liquidity-engine
    environment:
      LST_HOST: "0.0.0.0"
      LST_PORT: "8050"
      LST_NATS_URL: nats://nats:4222
      LST_NATS_STREAM: tnsvt
      LST_NATS_SUBJECT_LST: tnsvt.lst.signal
      LST_MT5_CONNECTOR_URL: http://mt5-connector:8007
      LST_SYMBOLS: XAUUSD
      LST_TIMEFRAMES: M1,M5,M15
      LST_LST_INTERVAL_SECONDS: "60"
    ports:
      - "${LIQUIDITY_ENGINE_PORT:-8050}:8050"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: apps/ai/orchestrator/Dockerfile
    container_name: tnsvt-orchestrator
    hostname: orchestrator
    environment:
      ORCH_HOST: "0.0.0.0"
      ORCH_PORT: "8060"
      ORCH_NATS_URL: nats://nats:4222
      ORCH_NATS_STREAM: tnsvt
      ORCH_NATS_SUBJECT_IN: tnsvt.lst.signal
      ORCH_NATS_SUBJECT_OUT: trading.signal.validated
      ORCH_MT5_CONNECTOR_URL: http://mt5-connector:8007
      ORCH_SYMBOLS: '["XAUUSD","EURUSD","GBPUSD","USDCHF"]'
      ORCH_TIMEFRAMES: M15,H1,H4
      ORCH_POLL_INTERVAL_SECONDS: "30"
      ORCH_HISTORY_WINDOW: "100"
      ORCH_CORRELATION_THRESHOLD: "0.7"
      ORCH_COINT_ENABLED: "true"
      ORCH_ACCOUNT_BALANCE: "10000.0"
      ORCH_RISK_PER_TRADE: "0.01"
      ORCH_MAX_DRAWDOWN: "0.15"
      ORCH_MAX_POSITIONS: "3"
      ORCH_ATR_PERIOD: "14"
      ORCH_SL_ATR_MULTIPLIER: "1.5"
      ORCH_TP_ATR_MULTIPLIER: "2.5"
      ORCH_TENANT_ID: ${ORCH_TENANT_ID:-00000000-0000-0000-0000-000000000001}
    ports:
      - "${ORCHESTRATOR_PORT:-8060}:8060"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  news-analyzer:
    build:
      context: .
      dockerfile: apps/ai/news-analyzer/Dockerfile
    container_name: tnsvt-news-analyzer
    hostname: news-analyzer
    environment:
      NATS_URL: nats://nats:4222
      NEWS_ANALYZER_PORT: "8051"
      PORT: "8051"
    ports:
      - "${NEWS_ANALYZER_PORT:-8051}:8051"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  macro-fetcher:
    build:
      context: .
      dockerfile: apps/data/macro-fetcher/Dockerfile
    container_name: tnsvt-macro-fetcher
    hostname: macro-fetcher
    environment:
      PORT: "8040"
    ports:
      - "${MACRO_FETCHER_PORT:-8040}:8040"
    networks:
      - tnsvt-network
    restart: unless-stopped

  account-manager:
    build:
      context: .
      dockerfile: apps/platform/account-manager/Dockerfile
    container_name: tnsvt-account-manager
    hostname: account-manager
    environment:
      ACCOUNT_MANAGER_PORT: "8510"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tnsvt}
      POSTGRES_USER: ${POSTGRES_USER:-tnsvt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnsvt}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_min_32_chars_abc}
      MT5_PASSWORD_KEY: ${MT5_PASSWORD_KEY:-dev_encryption_key_min_32_chars_change_me_xyz}
      ACCOUNT_MGR_SERVICE_TOKEN: ${ACCOUNT_MGR_SERVICE_TOKEN:-dev_account_mgr_service_token_change_me}
    ports:
      - "${ACCOUNT_MANAGER_PORT:-8510}:8510"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  lst-account-bootstrap:
    build:
      context: .
      dockerfile: apps/integrations/lst-account-bootstrap/Dockerfile
    container_name: tnsvt-lst-account-bootstrap
    hostname: lst-account-bootstrap
    environment:
      ACCOUNT_MANAGER_URL: http://account-manager:8510
      LST_TENANT_ID: ${LST_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      LST_LOGIN: ${LST_LOGIN:-12345678}
      LST_SERVER: ${LST_SERVER:-YourBroker-MT5}
      LST_PASSWORD: ${LST_PASSWORD:-}
      LST_BROKER: ${LST_BROKER:-YourBroker}
      LST_ALIAS: ${LST_ALIAS:-lst-main}
      LST_ACCOUNT_ID_FILE: /var/run/tnsvt/secrets/lst_account_id
    volumes:
      - tnsvt-secrets:/var/run/tnsvt/secrets
    depends_on:
      account-manager:
        condition: service_started
    networks:
      - tnsvt-network
    restart: "no"

  news-bridge:
    build:
      context: .
      dockerfile: apps/integrations/news-bridge/Dockerfile
    container_name: tnsvt-news-bridge
    hostname: news-bridge
    environment:
      NATS_URL: nats://nats:4222
      NEWS_SUBJECT: trading.signal.news_based
      SIGNAL_ENGINE_URL: http://signal-engine:8003
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      SIGNAL_INGEST_API_KEY: ${SIGNAL_INGEST_API_KEY:-dev_ingest_key_change_me}
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  mcp-trading-server:
    build:
      context: .
      dockerfile: apps/integrations/mcp-trading-server/Dockerfile
    container_name: tnsvt-mcp-trading-server
    hostname: mcp-trading-server
    environment:
      MCP_NATS_URL: nats://nats:4222
      MCP_NATS_STREAM: tnsvt
      MCP_LST_SIGNAL_SUBJECT: tnsvt.lst.signal
      MCP_CONTROL_SUBJECT: trading.control
      MCP_ORCHESTRATOR_URL: http://orchestrator:8060
      MCP_GATEWAY_URL: http://api-gateway:8000
      MCP_MT5_CONNECTOR_URL: http://mt5-connector:8007
    ports:
      - "${MCP_TRADING_SERVER_PORT:-8100}:8100"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

  price-feed:
    build:
      context: .
      dockerfile: apps/market-data/price-feed/Dockerfile
    container_name: tnsvt-price-feed
    hostname: price-feed
    environment:
      PRICE_FEED_PORT: "8300"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRICE_FEED_SYMBOLS: ${PRICE_FEED_SYMBOLS:-EURUSD,GBPUSD,USDJPY,XAUUSD,BTCUSD}
      PRICE_FEED_MOCK_URL: ${PRICE_FEED_MOCK_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_HOST: nats
      NATS_PORT: "4222"
    ports:
      - "${PRICE_FEED_PORT:-8300}:8300"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - tnsvt-network
    restart: unless-stopped

